<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="ringGlow" cx="0" cy="0" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ecbff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#7ecbff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Soft white halo at the centre -->
  <circle r="480" fill="url(#ringGlow)"/>

  <!-- Outer thin ring -->
  <circle r="430" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <circle r="420" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Mid ring with tick marks -->
  <g stroke="#cfeaff" stroke-opacity="0.42" stroke-width="1">
    <circle r="360" fill="none"/>
    <g>
      <!-- 60 tick marks around the mid ring -->
      <g id="ticks">
        <line x1="0" y1="-360" x2="0" y2="-348"/>
      </g>
      <use href="#ticks" transform="rotate(6)"/>
      <use href="#ticks" transform="rotate(12)"/>
      <use href="#ticks" transform="rotate(18)"/>
      <use href="#ticks" transform="rotate(24)"/>
      <use href="#ticks" transform="rotate(30)"/>
      <use href="#ticks" transform="rotate(36)"/>
      <use href="#ticks" transform="rotate(42)"/>
      <use href="#ticks" transform="rotate(48)"/>
      <use href="#ticks" transform="rotate(54)"/>
      <use href="#ticks" transform="rotate(60)"/>
      <use href="#ticks" transform="rotate(66)"/>
      <use href="#ticks" transform="rotate(72)"/>
      <use href="#ticks" transform="rotate(78)"/>
      <use href="#ticks" transform="rotate(84)"/>
      <use href="#ticks" transform="rotate(90)"/>
      <use href="#ticks" transform="rotate(96)"/>
      <use href="#ticks" transform="rotate(102)"/>
      <use href="#ticks" transform="rotate(108)"/>
      <use href="#ticks" transform="rotate(114)"/>
      <use href="#ticks" transform="rotate(120)"/>
      <use href="#ticks" transform="rotate(126)"/>
      <use href="#ticks" transform="rotate(132)"/>
      <use href="#ticks" transform="rotate(138)"/>
      <use href="#ticks" transform="rotate(144)"/>
      <use href="#ticks" transform="rotate(150)"/>
      <use href="#ticks" transform="rotate(156)"/>
      <use href="#ticks" transform="rotate(162)"/>
      <use href="#ticks" transform="rotate(168)"/>
      <use href="#ticks" transform="rotate(174)"/>
      <use href="#ticks" transform="rotate(180)"/>
      <use href="#ticks" transform="rotate(186)"/>
      <use href="#ticks" transform="rotate(192)"/>
      <use href="#ticks" transform="rotate(198)"/>
      <use href="#ticks" transform="rotate(204)"/>
      <use href="#ticks" transform="rotate(210)"/>
      <use href="#ticks" transform="rotate(216)"/>
      <use href="#ticks" transform="rotate(222)"/>
      <use href="#ticks" transform="rotate(228)"/>
      <use href="#ticks" transform="rotate(234)"/>
      <use href="#ticks" transform="rotate(240)"/>
      <use href="#ticks" transform="rotate(246)"/>
      <use href="#ticks" transform="rotate(252)"/>
      <use href="#ticks" transform="rotate(258)"/>
      <use href="#ticks" transform="rotate(264)"/>
      <use href="#ticks" transform="rotate(270)"/>
      <use href="#ticks" transform="rotate(276)"/>
      <use href="#ticks" transform="rotate(282)"/>
      <use href="#ticks" transform="rotate(288)"/>
      <use href="#ticks" transform="rotate(294)"/>
      <use href="#ticks" transform="rotate(300)"/>
      <use href="#ticks" transform="rotate(306)"/>
      <use href="#ticks" transform="rotate(312)"/>
      <use href="#ticks" transform="rotate(318)"/>
      <use href="#ticks" transform="rotate(324)"/>
      <use href="#ticks" transform="rotate(330)"/>
      <use href="#ticks" transform="rotate(336)"/>
      <use href="#ticks" transform="rotate(342)"/>
      <use href="#ticks" transform="rotate(348)"/>
      <use href="#ticks" transform="rotate(354)"/>
    </g>
  </g>

  <!-- Major spokes (8) -->
  <g stroke="#bfe1ff" stroke-opacity="0.35" stroke-width="1">
    <g id="spoke">
      <line x1="0" y1="-360" x2="0" y2="-130"/>
      <line x1="-6" y1="-200" x2="6" y2="-200"/>
      <circle cx="0" cy="-200" r="3" fill="#cfeaff" stroke="none"/>
    </g>
    <use href="#spoke" transform="rotate(45)"/>
    <use href="#spoke" transform="rotate(90)"/>
    <use href="#spoke" transform="rotate(135)"/>
    <use href="#spoke" transform="rotate(180)"/>
    <use href="#spoke" transform="rotate(225)"/>
    <use href="#spoke" transform="rotate(270)"/>
    <use href="#spoke" transform="rotate(315)"/>
  </g>

  <!-- Hexagonal core -->
  <g fill="none" stroke="#e8f4ff" stroke-opacity="0.55" stroke-width="1.3">
    <polygon points="120,0 60,103.92 -60,103.92 -120,0 -60,-103.92 60,-103.92"/>
    <polygon points="80,0 40,69.28 -40,69.28 -80,0 -40,-69.28 40,-69.28"/>
  </g>
  <g fill="none" stroke="#ffe27a" stroke-opacity="0.55" stroke-width="0.8">
    <polygon points="160,0 80,138.56 -80,138.56 -160,0 -80,-138.56 80,-138.56"/>
  </g>
  <circle r="22" fill="#ffffff" fill-opacity="0.12"/>
  <circle r="6" fill="#ffe27a" fill-opacity="0.85"/>

  <!-- Inner ring with breaks (techy) -->
  <g fill="none" stroke="#cfeaff" stroke-opacity="0.45" stroke-width="1">
    <path d="M 240 0 A 240 240 0 0 1 169.7 169.7"/>
    <path d="M 120 207.85 A 240 240 0 0 1 -120 207.85"/>
    <path d="M -169.7 169.7 A 240 240 0 0 1 -240 0"/>
    <path d="M -240 0 A 240 240 0 0 1 -169.7 -169.7"/>
    <path d="M -120 -207.85 A 240 240 0 0 1 120 -207.85"/>
    <path d="M 169.7 -169.7 A 240 240 0 0 1 240 0"/>
  </g>

  <!-- Outer cardinal markers -->
  <g fill="#ffffff" fill-opacity="0.4">
    <rect x="-2" y="-440" width="4" height="20"/>
    <rect x="-2" y="420" width="4" height="20"/>
    <rect x="-440" y="-2" width="20" height="4"/>
    <rect x="420" y="-2" width="20" height="4"/>
  </g>
</svg>
